version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: earthquake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: earthquake_db
      POSTGRES_USER: earthquake_user
      POSTGRES_PASSWORD: earthquake_pass
    ports:
      - "5432:5432"
    volumes:
      - earthquake_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthquake_user -d earthquake_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  earthquake_pgdata: